; SYNTHETIC SAMPLE for the MuckaII mucka.ini importer. Not a real user's file.
; Covers: inline comments, a header with a trailing comment, a duplicate
; section, duplicate keys, mixed case, malformed numbers and booleans, a
; profile name containing '#', and a watch slot defined after its table.
; Expected parse: docs/spec/mucka-ini.md, "Samples".
# hash comments are whole-line comments too

[watch]
first = You see the word "..." carved here.

; ignored: slot 'late' is not defined yet at this point
[watch late]
"abc..." = def

[watch]
late = The plaque says: "..."

[FKeys]
F3=kill rat
f3=kill rat with sword
F37=ignored, out of range
G1=ignored, not an F-key

[settings] ; global block
fontsize=99
volume=1

[Settings]
FontSize=16 ; big
volume=60
volume=10
mutebeep=On
statupdate=ten
saycolor=#f9f1a5

[settings]
columns=200

[profiles]
1=Test # one
2=Plain

[profile:Plain]
host=mud2.co.uk
port=23x
rememberpassword=maybe

[profile:Test # one]
host=mud2.co.uk
port=23
