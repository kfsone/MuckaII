; SYNTHETIC SAMPLE for the MuckaII mucka.ini importer. Not a real user's file.
; Covers: an override that replaces rather than merges, an empty per-profile
; fkeys section, orphan override sections, the sound key families, [profiles]
; keys out of numeric order, and a profile section not listed in [profiles].
; Expected parse: docs/spec/mucka-ini.md, "Samples".

[profiles]
2=Beta
1=Alpha

[profile:Alpha]
host=mud2.co.uk
port=23
account=Z00000011
rememberpassword=no
telnetlogin=yes
loginname=mud
columns=0
antiidle=300
keepscreenon=no
defaulthotkeys=no

[profile:Beta]
host=www.mud2.com
port=27723
account=p00000012
rememberpassword=yes
telnetlogin=yes
loginname=mud
columns=80
antiidle=0
keepscreenon=yes
defaulthotkeys=yes

; not listed in [profiles]: appended after the listed ones
[profile:Gamma]
host=mud.example.org
port=2323
telnetlogin=no
loginname=

[settings]
fontsize=15
columns=80
volume=30
statupdate=10
mutebeep=no
sounds=yes
soundgroup.13=off
sound.0703=off
sounddefault.07=070000
soundgroupvol.07=50
soundvol.0711=150
soundgroupvol.bell=20
defaultfontsize=15
chattheme=dusk

[fkeys]
F1=look
F2=inventory

; Alpha saved "to profile only": no volume here, so Alpha's volume is the
; built-in 75, not 30 from [settings].
[settings:Alpha]
fontsize=18
columns=0
statupdate=0
mutebeep=yes

; present and empty: every Alpha slot is empty, [fkeys] is not used
[fkeys:Alpha]

; orphans left by a deleted profile: read by nothing
[settings:Deleted]
volume=99

[fkeys:Deleted]
F1=quit
