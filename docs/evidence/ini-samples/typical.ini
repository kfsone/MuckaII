; SYNTHETIC SAMPLE for the MuckaII mucka.ini importer. Not a real user's file.
; Shape derived from the director's mucka.ini (section order, key set, obsolete keys).
; Replaced with fakes: account IDs, persona names, profile names, the private
; host and port, every [watch] trigger and answer, and the F-key macro text
; beyond its shape. Expected parse: docs/spec/mucka-ini.md, "Samples".
;
; [watch] is hand-written. Mucka never wrote it and kept it verbatim.
; Use ' = ' (space-equals-space) so keys can contain '='.

[watch]
crypta = the first crypt reads: "..."
cryptb = the second crypt reads: "..."

; echo mode: no [watch note] table, the captured word is the answer
note   = Scrawled on the note is: "..."

[watch crypta]
"Red, Gree..."   = Blue
"apple=3, p..."  = 12

[watch cryptb]
"Seven 14 2..."  = 28
"ZYX WVU T..."   = SRQ

