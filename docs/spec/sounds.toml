# docs/spec/sounds.toml
#
# FACT Every sound file in assets/sounds/, what fires it, how the user sees it in settings,
# and the playback rules (gating, volume, timing, bell). Behaviour only.
# source: reference
#
# Conventions in this file:
# - Code notation is Bartle's decrypted form, e.g. "07 02 01" (each integer has 155 added on
#   the wire and the sequence ends FF FF). source: bartle:FE4 section 3
# - "params" = the integers after the family number, as sent.
# - Every table carries tag, source and scope. open = an unresolved question for the director.
# - category = the group heading the user sees in the Sounds settings tab.

# ---------------------------------------------------------------------------
# Playback rules
# ---------------------------------------------------------------------------

[[rule]]
id = "file-from-code"
tag = "FACT"
text = "A server sound code maps to a file name by zero-padding each integer to two digits and concatenating: family only -> clio.FF.wav; family + 1 param -> clio.FFAA.wav; family + 2 params -> clio.FFAABB.wav. Any further params are ignored."
source = "clio:src/sound.c"
scope = "launch"

[[rule]]
id = "engine-always-open"
tag = "RULE"
text = "One audio output stream is opened at startup and stays open for the life of the process. Every sound file is decoded to PCM when it loads. Playing a sound adds a voice to an in-process mixer and never opens, leases, or waits on a device or player. Any number of voices may overlap: you and an enemy taking damage in the same turn are both heard."
source = "director"
scope = "launch"
enforced_by = "none: judgement"

[[rule]]
id = "engine-scheduled-start"
tag = "RULE"
text = "Every play request carries a start time on the audio clock, in frames. A sound triggered by the server passes 'now'. Scheduled sounds (the combat metronome) pass a predicted time. A sound begins sounding at its start frame with no leading silence."
source = "director"
scope = "launch"
enforced_by = "none: judgement"

[[rule]]
id = "no-silence-padding"
tag = "DECISION"
text = "Rejected: padding a sound file with leading silence so that player start-up latency does not swallow its start. It shifts every sound late by the padding, and it is the workaround Mucka shipped. Latency is removed by the always-open engine (engine-always-open) instead."
source = "director"
scope = "launch"

[[rule]]
id = "metronome-book-ends"
tag = "RULE"
text = "The combat metronome book-ends each tick T, where T is a frame on the audio clock. The pre-tick click must FINISH at T, so pre.start = T - pre.duration_frames. The post-tick click STARTS at T, so post.start = T. Worked example at 48000 Hz: with T = 480000 and a 30 ms pre click (1440 frames), pre.start = 478560 and post.start = 480000. A unit test asserts these frame positions. The visual tick sweep is driven from the same clock, shifted by the output latency the device reports, so the sweep, the clicks and the server's combat messages share one timebase."
source = "director"
scope = "later"
enforced_by = "none: judgement"

[[rule]]
id = "which-codes-sound"
tag = "FACT"
text = "Only these families ever produce a sound: 06, 07, 08 (01 and 03 only), 11 (except 11 06, 11 09, 11 14), 13, 14 03 02, 18 00..18 06. Codes 17 (music) and 20 (background noise) are documented by Bartle but neither Clio nor the reference plays anything for them, and no files exist."
source = "clio:src/telnet.l"
scope = "launch"

[[rule]]
id = "timing-line-complete"
tag = "RULE"
text = "A code-triggered sound is queued when its code is decoded and played when the line it introduces completes (newline, or a partial/prompt flush)."
source = "reference"
scope = "launch"
enforced_by = "none: judgement"

[[rule]]
id = "self-act-echo-silent"
tag = "RULE"
text = "In game mode, a line beginning 'OK, ' followed by whitespace (the game's acknowledgement of your own act/social, e.g. 'OK, you wave.') plays none of its queued sounds. The act's code announces the act to the room; hearing your own back is noise."
source = "reference"
scope = "launch"
enforced_by = "none: judgement"

[[rule]]
id = "session-end-drops-queue"
tag = "RULE"
text = "Sounds queued but not yet played when game mode ends (quit, reset, drop) are discarded, not played."
source = "reference"
scope = "launch"
enforced_by = "none: judgement"

[[rule]]
id = "text-triggers-game-mode"
tag = "RULE"
text = "Text-triggered sounds (see the sound rows with trigger_kind = text) fire only in game mode, on a line that starts with the given text."
source = "clio:src/telnet.l"
scope = "launch"
enforced_by = "none: judgement"

[[rule]]
id = "override-file"
tag = "RULE"
text = "When a file mucka.NNNN.wav exists for a code NNNN, it plays instead of clio.NNNN.wav. The code, settings row and volume stay those of the clio code. Only 13 07 has an override (mucka.1307.wav)."
source = "reference"
scope = "launch"
enforced_by = "none: judgement"

[[rule]]
id = "group-fallback"
tag = "RULE"
text = "When the server sends a code in a known group (06, 07, 08, 11, 13, 14, 18) whose file does not exist (e.g. 18 05, 07 01, 13 28), the group's chosen fallback sound plays. Each group has a fallback picker in settings listing '(none)' and the group's sounds; default '(none)', which is silent. Codes outside every group, or with no file and no fallback, are silent. Tells and Client alerts have no picker."
source = "reference"
scope = "launch"
enforced_by = "none: judgement"

[[rule]]
id = "gating"
tag = "RULE"
text = "A sound plays only if the master Sounds switch is on, its group is on, and its own row is on. Turning a group off greys out and silences all its rows. All are on by default; only the user's 'off' choices are stored."
source = "reference"
scope = "launch"
enforced_by = "none: judgement"

[[rule]]
id = "volume-inheritance"
tag = "RULE"
text = "Volume is 0-100, linear. Master default 75. A group slider follows the master until the user moves it; a sound slider follows its group until moved. Dragging a slider back onto its parent's value re-attaches it (it follows again). A sound plays at its own override, else its group's, else master. Each row has a play button that previews at exactly the volume that row will play at."
source = "reference"
scope = "launch"
enforced_by = "none: judgement"

[[rule]]
id = "reset-sounds"
tag = "RULE"
text = "The Sounds tab has a reset: master on, master volume 75, every group and row on, every slider re-attached, every fallback '(none)', bell un-muted."
source = "reference"
scope = "launch"
enforced_by = "none: judgement"

[[rule]]
id = "no-overlap-tells"
tag = "RULE"
text = "Tell alerts never overlap: while one tell alert is playing, further tell alerts are dropped (not queued). Other sounds may overlap freely, including several in one line."
source = "reference"
scope = "launch"
enforced_by = "none: judgement"

[[rule]]
id = "never-block"
tag = "RULE"
text = "Playing a sound never blocks or delays input, rendering or the socket reader (Invariant #1). A missing or unplayable file is silently skipped."
source = "director"
scope = "launch"
enforced_by = "none: judgement"

[[rule]]
id = "clio-sfx-levels"
tag = "FACT"
text = "Clio has a 3-level sound switch cycled by Ctrl+W: 0 = disabled, 1 = 'standard' (family 13 only, the in-world 'In the distance you hear...' sounds), 2 = 'extended' (all families; the default). The reference replaces this with master/group/row switches."
source = "clio:src/sound.c"
scope = "launch"

[[rule]]
id = "near-far"
tag = "FACT"
text = "Bartle lists every 13 NN code twice: third number 01 heard near, 02 heard far (13 01 01 and 13 01 02 are the ox lowing)."
note = ""
source = "bartle:FE4 code 13"
scope = "launch"
open = "Clio and the reference require exactly two params and play the same file at the same volume for near and far (the third integer is ignored). Should far be quieter? Director to decide; default is to keep identical."

[[rule]]
id = "theme-at-startup"
tag = "FACT"
text = "mucka_theme.wav plays once when the app window first opens, before any profile or settings are loaded, at volume 75. It is not gated by the master switch and has no settings row."
source = "reference"
scope = "launch"
open = "Should the startup theme respect the master switch / a settings row in MuckaII? Should it play at all?"

[[rule]]
id = "mp3-in-wav"
tag = "FACT"
text = "clio.1324.wav is MP3 data in a WAV wrapper (format tag 0x55, mono, 11025 Hz). Every other file is PCM. The player must decode MP3-in-WAV or the file must be re-encoded to PCM before shipping."
source = "reference"
scope = "launch"

[[rule]]
id = "placeholder-clicks"
tag = "FACT"
text = "clio.070000.wav, clio.0703.wav, clio.0704.wav and clio.0705.wav are byte-identical, about 10 ms long (8-bit 22050 Hz): effectively a click. All 19 clio.11*.wav files are byte-identical (one 'spell' sound). clio.070100 = clio.070101; clio.070200 = clio.070201 = clio.070202."
source = "reference"
scope = "launch"

# ---------------------------------------------------------------------------
# Terminal bell
# ---------------------------------------------------------------------------

[bell]
tag = "RULE"
file = "beep.wav"
trigger = "BEL byte 0x07 in the received stream"
category = "Terminal bell (beep)"
default_enabled = true
text = "A received BEL plays beep.wav unless: the bell is muted for this session, or muted permanently, or the master Sounds switch is off. At most one bell per 2 seconds; bells inside that window are dropped. Volume = the bell row's slider (follows master until moved)."
settings = "Bell row in the Sounds tab (on/off + volume + preview). Two checkboxes: 'mute for this session' and 'mute permanently'. Turning the bell row off sets both; turning it on clears both. Clearing session-mute also clears permanent-mute. Session mute starts each session equal to permanent mute. Permanent mute persists as mucka.ini [settings] mutebeep=yes|no; session mute is never persisted."
source = "reference"
scope = "launch"
enforced_by = "none: judgement"

# ---------------------------------------------------------------------------
# Settings persistence (mucka.ini import keys; full format in mucka-ini.md)
# ---------------------------------------------------------------------------

[ini_keys]
tag = "FACT"
text = "Sound settings live in [settings] (or [settings:<profile>]). Only overrides are written."
keys = [
  "volume=<0-100>                    master volume, default 75",
  "sounds=yes|no                     master switch, default yes",
  "soundgroup.<group>=off            group switched off (group = 06, 07, 08, 11, 13, 14, 18, tell, alert, bell)",
  "sound.<code>=off                  one row switched off (code = 0703, 070001, tell-wiz, alert-flee-failed ...)",
  "sounddefault.<group>=<code>       group fallback choice",
  "soundgroupvol.<group>=<0-100>     group volume override",
  "soundvol.<code>=<0-100>           row volume override",
  "mutebeep=yes|no                   bell muted permanently",
]
source = "reference"
scope = "launch"
open = "mucka-ini.md says <group> is a numeric code prefix or 'bell' (soundgroupvol.bell only; bell on/off is mutebeep) and <code> is numeric. This table also lists soundgroup.bell, groups 'tell' and 'alert', and codes 'tell-wiz' and 'alert-flee-failed'. Which key set did the reference read and write?"

