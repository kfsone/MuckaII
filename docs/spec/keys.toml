# keys.toml - every key chord MuckaII binds, and what each one does.
#
# FACT Each [[key]] entry is a RULE: on the given platform and in the given context, the chord
# performs the action. enforced_by: none: judgement
# source: reference (unless an entry says otherwise)
#
# Field meanings:
#   chord    - the key chord as the user presses it. "Ctrl" means the Control key.
#   context  - "live": command box focused, terminal showing live output.
#              "scrollback": terminal frozen on history (see input.md, Scrollback).
#              "any": both.
#   platform - "desktop": the Windows GUI, and the TUI on Windows, Linux and macOS (INTERNAL.md,
#              Platforms). "android": a hardware keyboard on Android, which is scope later.
#              "all": both.
#   action   - what MuckaII does: the built behaviour, taken from the DECISIONs and from the
#              defaults of open items. Reference behaviour that differs is in the open item.
#   sends    - exact text written to the socket, or "" when nothing is sent. Every sent line is
#              terminated by CR LF (0x0D 0x0A), which is not shown. Text in <angle brackets> is a
#              placeholder. Only F-key and ^n macro bodies pass through alias and watchword
#              expansion (input.md, Expansion); flee, dreamword and wield texts do not.
#   scope    - now | later (INTERNAL.md).
#   note     - extra detail that is not a rule, or absent.
#   open     - an unresolved question for the director.
#   default  - what to build until the director rules on the open question. Every open has one.
#              Where input.md already holds the open item (OPEN D1-D5), the entry has no open of
#              its own; its note points there.
#
# RULE A chord is bound to at most one action per platform and context. A second binding of
# the same chord is a startup error, not a silent override.
# enforced_by: none: judgement
# source: reference
#
# RULE A bound chord performs only its bound action; the platform's default for that chord (for
# example Ctrl+W closing a window or tab, Ctrl+R reloading, Ctrl+F opening find, Ctrl+D
# bookmarking in a web view) is suppressed.
# enforced_by: none: judgement
# source: reference
#
# RULE A hotkey that sends is a send (core::submitLine); one that edits the box (Ctrl+R, Escape,
# Up, Down) is a box edit (architecture.md, Input: two orderings). A hotkey never overtakes an
# earlier Enter.
# enforced_by: none: judgement
# source: agent, reference
#
# RULE After any hotkey action, keyboard focus is in the command box.
# enforced_by: none: judgement
# source: director (Invariant #0), reference

# ---------------------------------------------------------------------------
# Command box keys
# ---------------------------------------------------------------------------

[[key]]
chord = "Enter"
context = "live"
platform = "all"
action = "Accept the line: empty the box, then hand the line to the input queue (input.md, Enter). An empty or whitespace-only line is still sent."
sends = '<line with leading and trailing whitespace removed, after client-command handling and expansion>'
scope = "now"
source = "reference"
note = "Open D1 (where the acceptance condition is measured; whether trimming stays): input.md, Invariant #1 and its acceptance condition."

[[key]]
chord = "Up"
context = "live"
platform = "all"
action = "Show the previous (older) history entry, or the edited copy of it left since the last Enter, caret at end. Leaving the unsent draft stashes it. At the oldest entry the box is left untouched. No-op when history is empty (input.md, History)."
sends = ""
scope = "now"
source = "reference; agent"
note = "Open D2 (history size, duplicates, wrap or clamp): input.md, History."

[[key]]
chord = "Down"
context = "live"
platform = "all"
action = "During a recall: show the next (newer) history entry, or its edited copy, caret at end; stepping past the newest entry restores the stashed draft. With no recall in progress: no-op, and the draft stays (input.md, History)."
sends = ""
scope = "now"
source = "reference; agent"
note = "Open D3 (the reference's Down emptied the box and destroyed the draft): input.md, History."

[[key]]
chord = "Tab"
context = "live"
platform = "all"
action = "Never moves keyboard focus out of the command box."
sends = ""
scope = "now"
source = "director (Invariant #0), reference"
open = "What Tab does inside the box (nothing, or insert a tab) is unspecified."
default = "Nothing: Tab is consumed, inserts no character and leaves focus in the box."

[[key]]
chord = "Escape"
context = "live"
platform = "all"
action = "If the About overlay is open, close it. Else if the score graph panel (scope later) is open, close it. Else empty the command box."
sends = ""
scope = "now"
source = "reference"

[[key]]
chord = "Home"
context = "live"
platform = "all"
action = "Platform default text-box behaviour: caret to start of the box. Does not touch scrollback."
sends = ""
scope = "now"
source = "reference"

[[key]]
chord = "End"
context = "live"
platform = "all"
action = "Platform default text-box behaviour: caret to end of the box. Does not touch scrollback."
sends = ""
scope = "now"
source = "reference"

[[key]]
chord = "Ctrl+C"
context = "live"
platform = "all"
action = "Platform default text-box behaviour (copy the box's selected text)."
sends = ""
scope = "now"
source = "reference"
open = "clio uses Ctrl-C to clear the input line, and 2x within 500 ms or 3x within 2 s on an empty line to exit. Keep platform copy?"
default = "Platform copy, as the reference does. This is taste, and clearing or exiting on Ctrl+C would discard typed text."

# ---------------------------------------------------------------------------
# Scrollback keys
# ---------------------------------------------------------------------------

[[key]]
chord = "PageUp"
context = "any"
platform = "desktop"
action = "Scroll one page toward older output (a page is the visible row count minus one). From live, enters scrollback."
sends = ""
scope = "now"
source = "reference"

[[key]]
chord = "PageDown"
context = "any"
platform = "desktop"
action = "Scroll one page toward newer output. Reaching the bottom returns to live. No-op when already live."
sends = ""
scope = "now"
source = "reference"

[[key]]
chord = "Home"
context = "scrollback"
platform = "desktop"
action = "Jump to the oldest retained line."
sends = ""
scope = "now"
source = "reference"

[[key]]
chord = "End"
context = "scrollback"
platform = "desktop"
action = "Return to live (bottom)."
sends = ""
scope = "now"
source = "reference"

[[key]]
chord = "Escape"
context = "scrollback"
platform = "desktop"
action = "Return to live (bottom). Focus goes back to the command box."
sends = ""
scope = "now"
source = "reference"

[[key]]
chord = "Ctrl+C"
context = "scrollback"
platform = "desktop"
action = "Copy the terminal selection to the clipboard. If something was copied, show the toast '* Copied to clipboard'."
sends = ""
scope = "now"
source = "reference"

[[key]]
chord = "<any other key>"
context = "scrollback"
platform = "desktop"
action = "The first printable key returns to live and lands in the line buffer, as does every key after it; no key is discarded. Lone modifier keys pass through (input.md, Scrollback)."
sends = ""
scope = "now"
source = "reference; director (Invariant #1)"
note = "Open D4 (the reference swallowed typed keys in scrollback): input.md, Scrollback."

# ---------------------------------------------------------------------------
# F-key macros: 36 slots, three layers of 12.
# Slot numbering is the mucka.ini / clio.ini layout: F1-F12 plain, F13-F24 Shift, F25-F36 Ctrl.
# ---------------------------------------------------------------------------

[[key]]
chord = "F1..F12"
context = "any"
platform = "all"
action = "Send macro slot 1..12 (F<n> sends slot <n>). Empty or whitespace-only slot: nothing sent. Returns to live first if in scrollback. See input.md, F-key macros."
sends = '<macro text of slot n, trailing CR/LF stripped, expanded>'
scope = "now"
source = "reference, clio:man/clio.6 FUNCTION KEYS"
note = "Open D5 (the reference swallowed F-keys in scrollback): input.md, Scrollback."

[[key]]
chord = "Shift+F1..Shift+F12"
context = "any"
platform = "all"
action = "Send macro slot 13..24 (Shift+F<n> sends slot 12+<n>). Returns to live first if in scrollback (as F1..F12)."
sends = '<macro text of slot 12+n, expanded>'
scope = "now"
source = "reference, clio:man/clio.6 FUNCTION KEYS"

[[key]]
chord = "Ctrl+F1..Ctrl+F12"
context = "any"
platform = "all"
action = "Send macro slot 25..36 (Ctrl+F<n> sends slot 24+<n>). Returns to live first if in scrollback (as F1..F12)."
sends = '<macro text of slot 24+n, expanded>'
scope = "now"
source = "reference, clio:man/clio.6 FUNCTION KEYS"

[[key]]
chord = "Ctrl+Shift+F1..Ctrl+Shift+F12"
context = "any"
platform = "desktop"
action = "Unbound."
sends = ""
scope = "now"
source = "reference"

[[key]]
chord = "Ctrl+Shift+F1..Ctrl+Shift+F12"
context = "any"
platform = "android"
action = "Unbound, as on desktop."
sends = ""
scope = "later"
source = "reference"
open = "The reference let Ctrl win on Android: Ctrl+Shift+F<n> sent macro slot 24+<n>, the same as Ctrl+F<n>, while desktop left it unbound. Pick one."
default = "Unbound on both, as on desktop, the primary platform."

# ---------------------------------------------------------------------------
# Game hotkeys
# ---------------------------------------------------------------------------

[[key]]
chord = "Ctrl+D"
context = "any"
platform = "all"
action = "Speak the current dreamword, in game mode only. No-op outside game mode or when no dreamword is held. Returns to live first if in scrollback. The send is also written to the wire log as the annotation 'dreamword spoken: <dreamword>'."
sends = '"<dreamword>"'
scope = "now"
source = "reference; clio:src/telnet.l"
open = "clio sends 'say \"<dreamword>\"' and only in game mode (clio:src/telnet.l CTRL-D); the reference sends '\"<dreamword>\"' (MUD2 quote shorthand for say) with no game-mode check. Which form, and which guard?"
default = "Send the reference form '\"<dreamword>\"', and only in game mode, as Clio guards it; outside game mode it is a no-op."

[[key]]
chord = "Ctrl+Shift+D"
context = "any"
platform = "desktop"
action = "Speak the dreamword and chain a follow-up command. Follow-up = the command box's current text, trimmed; one leading comma is removed; empty means 'sleep'. If the text starts with ',,' nothing is sent and the toast '* cannot append input starting ,,' is shown (',,' repeats the last command in MUD2). The box is left untouched. No-op when no dreamword is held. Returns to live first if in scrollback. Wire-log annotation: 'dreamword spoken: <dreamword> ,<follow>'."
sends = '"<dreamword>",<follow>'
scope = "now"
source = "reference"
open = "Reference defect: the follow-up came from a stale copy of the box, so it usually sent 'sleep' or the last recalled/prefilled text. The action above uses the box's current text. Confirm."
default = "The box's current text: the line buffer at the moment the key is applied (root CLAUDE.md, Invariant #1)."

[[key]]
chord = "Ctrl+Shift+D"
context = "any"
platform = "android"
action = "Same as Ctrl+D (Shift is ignored on Android)."
sends = '"<dreamword>"'
scope = "later"
source = "reference"
open = "Android lacks the chained form. Intended?"
default = "Keep the reference: on Android Ctrl+Shift+D is the same as Ctrl+D."

[[key]]
chord = "Ctrl+F"
context = "any"
platform = "desktop"
action = "Flee. Returns to live first if in scrollback. Always sends, even out of combat."
sends = 'flee'
scope = "now"
source = "reference; director (scope)"

[[key]]
chord = "Ctrl+Shift+F"
context = "any"
platform = "desktop"
action = "Flee in the direction typed in the command box: the box text, trimmed. Empty box sends a bare 'flee'. The box is left untouched. Returns to live first if in scrollback."
sends = 'flee <box text>'
scope = "now"
source = "reference; director (scope)"
open = "Same stale-copy defect as Ctrl+Shift+D: the reference usually sent a bare 'flee'. The action above uses the box's current text."
default = "The box's current text: the line buffer at the moment the key is applied (root CLAUDE.md, Invariant #1)."

[[key]]
chord = "Ctrl+W"
context = "any"
platform = "desktop"
action = "Wield the combat rail's alternate weapon, sending only the item's final word (the noun). No-op when the rail offers no alternate weapon (only during a fight). Returns to live first if in scrollback. Wire-log annotation: 'alt weapon: wield <noun>'."
sends = 'wield <noun>'
scope = "later"
source = "reference"
note = "Open D5 (the reference swallowed Ctrl+W in scrollback): input.md, Scrollback."

[[key]]
chord = "Ctrl+R"
context = "any"
platform = "desktop"
action = "Reply to the last tell: replace the command box with the sender's name, a space and a double quote, caret at end. Sends nothing. With no tell received this connection, prints the system line '[reply] Nobody has sent you a tell yet.'. The sender is the last named teller ('Someone' and 'Someone powerful' never count); it resets on disconnect. Returns to live first if in scrollback."
sends = ""
scope = "now"
source = "reference; director (scope)"
note = "The prefill (rather than sending MUD2's 're') shows who the reply goes to before it is sent. Open D5 (the reference swallowed Ctrl+R in scrollback): input.md, Scrollback."

[[key]]
chord = "Ctrl+1"
context = "any"
platform = "desktop"
action = "Send control-macro slot ^1 (input.md, Aliases), expanded. Undefined slot: nothing sent, no message. Returns to live first if in scrollback."
sends = '<body of ^1, expanded>'
scope = "now"
source = "reference"

[[key]]
chord = "Ctrl+2"
context = "any"
platform = "desktop"
action = "As Ctrl+1, for slot ^2."
sends = '<body of ^2, expanded>'
scope = "now"
source = "reference"

[[key]]
chord = "Ctrl+3"
context = "any"
platform = "desktop"
action = "As Ctrl+1, for slot ^3. There is no Ctrl+4 or higher."
sends = '<body of ^3, expanded>'
scope = "now"
source = "reference"

[[key]]
chord = "Ctrl+`"
context = "live"
platform = "desktop"
action = "Screenshot: save the whole window as a timestamped PNG in the temp directory and briefly flash the window title. A developer tool."
sends = ""
scope = "later"
source = "reference"

# ---------------------------------------------------------------------------
# Platform notes
# ---------------------------------------------------------------------------

[[note]]
text = "Android is scope later (INTERNAL.md, Platforms). When it is built, Android hardware keyboards get only: F1-F12 with Shift and Ctrl layers, Ctrl+D, Up, Down, Escape. Ctrl+1..3, Ctrl+F, Ctrl+W, Ctrl+R and PageUp/PageDown are desktop only. A phone soft keyboard has no Ctrl+digit; the ^1..^3 slots run by typing ^1 and Enter."
source = "reference"

[[note]]
text = "macOS: only the TUI runs there for now; the GUI is Windows only (INTERNAL.md, Platforms). Whether the TUI's Ctrl chords stay Ctrl or become Cmd is undecided."
source = "director"
open = "Ctrl or Cmd for the TUI's chords on macOS?"
default = "Ctrl, as on Windows and Linux. The director tests macOS when it becomes relevant."

[[note]]
text = "Mouse and touch, not keys: wheel and drag scrollback, right-click copy, clicking a name - see input.md, Scrollback and Prefills."
source = "reference"
