# MUD2 C1 context codes.
#
# FACT One entry per code MUD2 is documented (or observed) to send. The table generates the
# decoder's code enum and the capture coverage tests, so every entry has every key.
# source: bartle:FE4 Codes and their meanings
#
# Keys (all present on every entry):
#   id          Bartle's code: decimal numbers 00-99, two digits each, space separated, exactly as
#               the FE4 list gives it. A missing trailing number reads as 00 (see protocol.md
#               "Parameters"), so "08" and "08 00" are the same code.
#   lead        The first byte on the wire: 155 + the first number (0x9B + n).
#   name        Unique identifier, snake_case as a data key. The generated C++ enumerator is
#               named per docs/style.md.
#   family      The code's first number, named.
#   params      Names of variable trailing numbers for parametric codes (94-99); [] when fixed.
#   stack       What the code does to the context stack (protocol.md "Context stack"):
#                 push        opens a frame; the next lone 255 at this level closes it
#                 push_empty  opens a frame that the server closes at once (nothing bracketed)
#                 catch       saves the whole stack and starts a new one; no frame, no colour change
#                 throw       reinstates the stack saved by the matching catch; no frame
#   meaning     Paraphrase of what the bracketed text is.
#   role        The event-level role in events.md, or "" when the code only styles text.
#   fg, bg      The /A colour the frame applies, as a colour index 0-15 (protocol.md "Colour
#               indices"). -1 = no colour change. -2 = taken from the code's own params (99).
#   observed    Number of headers in the six captures in docs/evidence/captures that match the
#               entry, counting headers inside FE replies and inside the FES line (58 of the 79
#               89 00 00 headers are inside FES lines).
#   observed_as The forms seen on the wire when they differ from id (a trailing 00 added, or the
#               actual params of a parametric code); [] when none.
#   fecodes     How bartle:FECodes (the older list) gives it: same | differs | absent.
#   scope       now | later.
#   source      Strongest source for the entry.
#   note        Extra detail, or "".
#
# FACT fg/bg are the colours the reference applies. They agree with clio:src/telnet.l (the
# non-Wireplay palette) for every code except where an entry carries an open: line.
# source: reference
# source: clio:src/telnet.l
#
# EVIDENCE The FE4 list itself says it is incomplete and points to a newer list (muddle/codes.mud)
# that is not available here.
# source: bartle:FE4 Codes and their meanings

